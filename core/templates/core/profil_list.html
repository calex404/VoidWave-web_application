{% extends "base.html" %}

{% block content %}
<div class="page-wrapper">
    <div class="glass-card glass-list">
        <h1 class="card-title">🔍 Pridať priateľov</h1>

        <div class="profile-stack">
            {% for profil in profily %}
                <div class="profile-row">
                    <div class="profile-hero-static">
                        {{ profil.nickname|default:profil.user.username }}
                    </div>

                    <div class="status-action-area">
                        <form method="post" action="{% url 'send_friend_request' profil.id %}" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn-success-big">+ PRIDAŤ</button>
                        </form>
                    </div>
                </div>
            {% empty %}
                <p class="empty-list-msg">Nenašli sa žiadni noví hráči.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}

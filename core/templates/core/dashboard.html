{% extends "base.html" %}

{% block content %}
<div class="page-wrapper" style="padding-top: 150px !important; display: flex; justify-content: center;">
    <div class="glass-card" style="max-width: 480px !important; width: 95% !important; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 40px;">
        
        <h1 style="text-align: center; color: white; margin-bottom: 30px; border-bottom: 1px solid var(--color-border); padding-bottom: 20px; font-weight: 800; text-transform: uppercase;">
            ⚙️ Ovládací panel
        </h1>

        <div class="dashboard-btn-container">
            <a href="{% url 'find_priatelov' %}" class="dash-btn-base btn-neon-blue">🔍 Nájsť priateľov</a>
            <a href="{% url 'profil_edit' %}" class="dash-btn-base btn-neon-pink">✏️ Upraviť profil</a>
            <a href="{% url 'profil_detail' user.profil.id %}" class="dash-btn-base btn-neon-orange">👁️ Môj verejný profil</a>
        </div>
        
    </div>
</div>
{% endblock %}
